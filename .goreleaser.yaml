version: 2

project_name: kfee

before:
  hooks:
    - go mod tidy

builds:
  - id: kfee
    binary: kfee
    main: ./cmd/kfee
    env:
      - CGO_ENABLED=0
    tags: prd
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - arm64
      - arm
      - amd64

archives:
  - formats: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - file_name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    maintainer: PSanetra
    homepage: https://github.com/PSanetra/kfee
    description: Kafka terminal client, a fork of ktea
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: utils
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/kfee/copyright
        file_info:
          mode: 0644

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: PSanetra
    name: kfee
  footer: >-

    ---

    kfee is a fork of [ktea](https://github.com/jonas-grgt/ktea).
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
